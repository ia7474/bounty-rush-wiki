  <style>
    /* メダルページ専用スタイル */
    .filter-box {
      background: white;
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .filter-box h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 14px;
    }
    .search-input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .tag-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .tag-btn {
      padding: 5px 12px;
      border-radius: 999px;
      border: 1.5px solid #d1d5db;
      background: #f9fafb;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tag-btn:hover {
      border-color: #3b82f6;
      color: #2563eb;
    }
    .tag-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }
    .effect-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .result-count {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 12px;
    }
    .medal-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .medal-card {
      background: white;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }
    .medal-card.hidden {
      display: none;
    }
    .medal-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: #111827;
    }
    .medal-meta {
      font-size: 0.9rem;
      color: #4b5563;
      line-height: 1.55;
    }
    .medal-meta strong {
      color: #374151;
    }
    .medal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }
    .medal-tag {
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .reset-btn {
      margin-top: 12px;
      padding: 6px 14px;
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    .reset-btn:hover {
      background: #e5e7eb;
    }
    @media (min-width: 640px) {
      .medal-card {
        grid-template-columns: 160px 1fr;
        gap: 16px;
        align-items: start;
      }
    }
  </style>
</head>

        const tagOk = activeTags.size === 0 || [...activeTags].every(t => medal.tags.includes(t));

        // 効果フィルター（選択したキーワードのいずれかを含む）
        const effectOk = activeEffects.size === 0 ||
          [...activeEffects].some(e => medal.trait.includes(e) || medal.stats.includes(e));

        // テキスト検索
        const text = (medal.name + medal.drop + medal.trait + medal.stats + medal.tags.join("")).toLowerCase();
        const searchOk = !query || text.includes(query);

        if (tagOk && effectOk && searchOk) {
          visibleCount++;
          const card = document.createElement("div");
          card.className = "medal-card";
          card.innerHTML = `
            <div>
              <div class="medal-name">${medal.name}</div>
              <div class="medal-tags">
                ${medal.tags.map(t => `<span class="medal-tag">${t}</span>`).join("")}
              </div>
            </div>
            <div class="medal-meta">
              <div><strong>ドロップ：</strong>${medal.drop}</div>
              <div><strong>固有特性：</strong>${medal.trait}</div>
              <div><strong>強化ステータス：</strong>${medal.stats}</div>
            </div>
          `;
          medalListEl.appendChild(card);
        }
      });

      resultCount.textContent = `表示中: ${visibleCount} / ${medals.length} 件`;
    }

    // 初回描画
    render();
  </script>

</body>
</html>
